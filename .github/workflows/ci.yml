# Checks every push and pull request: formatting, types, lint, tests (frontend and Rust) and clippy.
# Actions are pinned to commits (the tag is in the comment), as in release.yml.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # The version itself comes from src-tauri/rust-toolchain.toml.
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Format (frontend)
        run: npm run format:check

      - name: Format (Rust)
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (frontend)
        run: npm test

      # tauri::generate_context! needs the built frontend.
      - name: Build frontend
        run: npm run build

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (Rust)
        working-directory: src-tauri
        run: cargo test
